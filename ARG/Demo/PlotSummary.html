
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .content-card {
            background-color: #ffffff;
            padding: 50px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 900px;
            width: 100%;
            line-height: 1.8;
        }

        .content-card h2 {
            font-size: 24px;
            color: #26376a;
            margin-bottom: 25px;
            text-align: center;
        }

        .content-card p {
            font-size: 16px;
            margin-bottom: 15px;
            text-indent: 2em;
        }

        .tips-list {
            margin-top: 30px;
            padding-left: 20px;
        }

        .tips-list h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        .tips-list li {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .ending-quote {
            margin-top: 40px;
            text-align: center;
            font-size: 18px;
            color: #555;
        }

        .ending-quote .highlight {
            font-family: "SimSun", serif;
            font-size: 22px;
            color: #26376a;
            font-weight: bold;
        }

        .footer {
            background-color: #26376a;
            color: #ccc;
            padding: 20px 40px;
            font-size: 13px;
            text-align: center;
        }

        .page-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            z-index: 9999;
        }

        .start-btn {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 12px 40px;
            background-color: #26376a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .start-btn:hover {
            background-color: #1a2a55;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="content-card">

            <h2>这是一个Demo</h2>

            <p>
                你被一个陌生人绑架关到一个密室之中，你需要收集线索，逃出密室。
                这是一个Demo，正式版将于2027年7月份发布
            </p>

            <div class="tips-list">
                <h3>游玩提示</h3>
                <ol>
                    <li>请使用电脑浏览器游玩，如使用手机可能导致跳转失败、文字图片错位等。</li>               
                    <li>推荐游玩时打开备忘录记录关键信息。</li>
                    <li>本游戏所有信息均显示在页面上，无需使用检查查看代码。</li>
                    <li>本游戏含有微量恐怖元素，无Jump scare。</li>
                    <li>注：本游戏中的所有剧情均为虚构如有雷同纯属巧合</li>
                </ol>
            </div>

            <a href="index.html" class="start-btn">开始游戏</a>

        </div>
    </div>

    <footer class="footer">
        <p></p>
    </footer>


</body>
</html>
