<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

        /* 全局字体放大1.5倍 */
        html { font-size: 150%; }
        .option-btn {
            text-align: left;
            white-space: normal;
            font-size: 1rem;
        }
        .analysis-card {
            border-left: 5px solid #17a2b8;
        }
        .progress-bar-custom {
            transition: width 0.3s ease;
        }
        .paper-select {
            max-width: 200px;
        }
        .exam-question {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        #question-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        /* 自定义判分弹窗 */
        .score-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .score-box {
            background: #fff;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 25px;
            border-radius: 12px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #dc3545;
            color: #fff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body class="bg-light">

<!-- 自定义判分弹窗 -->
<div class="score-modal" id="scoreModal">
    <div class="score-box">
        <button class="close-btn" onclick="closeScoreModal()">×</button>
        <div id="scoreResult"></div>
    </div>
</div>

<div class="container mt-4 mb-5">
    <ul class="nav nav-tabs nav-fill mb-4" id="studyTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-mode="seq">顺序练习</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-mode="random">随机练习</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-mode="topic">专题练习</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-mode="exam">模拟考试</button>
        </li>
    </ul>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap">
            <span id="mode-title">正在练习：顺序练习</span>
            <div class="d-flex gap-2 align-items-center mt-2 mt-md-0">
                <span id="progress-text" class="badge bg-secondary d-none">1/18</span>
                <select id="paperSelector" class="form-select form-select-sm paper-select d-none" onchange="changePaper()">
                    <option value="0">请选择套卷</option>
                </select>
                <button id="random-refresh-btn" class="btn btn-sm btn-warning d-none" onclick="refreshRandom()">随机抽题</button>
                <button id="exam-generate-btn" class="btn btn-sm btn-primary d-none" onclick="generateExamPaper()">生成试卷</button>
            </div>
        </div>
        
        <div class="card-body">
            <div id="practice-area">
                <div id="topic-settings" class="mb-4 p-3 bg-light rounded d-none">
                    <h6>选择题库标签</h6>
                    <div id="tag-container" class="mb-2"></div>
                    <button class="btn btn-primary btn-sm" onclick="startTopicPractice()">开始专题练习</button>
                </div>

                <div class="progress mb-4 d-none" style="height: 8px;" id="progress-box">
                    <div id="progress-bar" class="progress-bar progress-bar-custom bg-primary" style="width: 10%"></div>
                </div>

                <div id="question-area">
                    <h5 class="mb-3" id="question-title">
                        <span class="badge bg-info me-2" id="q-type">单选</span>
                        <span id="q-content">加载题目中...</span>
                    </h5>
                    <div class="d-grid gap-2 mb-4" id="options-container"></div>
                </div>

                <div id="feedback-area" class="d-none">
                    <div id="correct-flag" class="alert alert-success"></div>
                    <div class="card analysis-card bg-light mb-4">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-2 text-muted">题目解析</h6>
                            <p class="card-text" id="q-analysis"></p>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between" id="practice-btns">
                    <button class="btn btn-outline-secondary" id="btn-prev" onclick="prevQuestion()">上一题</button>
                    <button class="btn btn-success" id="btn-next" onclick="nextQuestion()">下一题</button>
                </div>
            </div>

            <div id="exam-area" class="d-none">
                <div id="exam-list" class="mb-4"></div>
                <button class="btn btn-danger w-100" onclick="submitExam()">提交试卷</button>
            </div>
        </div>
    </div>
</div>

R 次幂)相乘，其积相加即可","将十进制数246转换成十六进制，其值为F6","将十进制数0.246转换为二进制数，其值为0.01101110","将二进制数转换为十六制数可使用“取四合一”法，从二进制的个位开始，每4位组 成一组，若高端不够4位，用0补足"],"answer":2,"analysis":"考点：数制转换；十进制0.246转换为二进制约为0.00111110，而非0.01101110，其余选项转换方法均正确","tags":["计算机基础","数制转换"],"difficulty":"中等"},{"id":3,"type":"choice","question":"信息编码中 BCD 码是指","options":["数字编码","字符编码","汉字编码","图形编码"],"answer":0,"analysis":"考点：信息编码；BCD码是用二进制编码表示十进制数字的数字编码","tags":["计算机基础","信息编码"],"difficulty":"容易"},{"id":4,"type":"choice","question":"信息编码中二维码是一种","options":["数字编码","字符编码","汉字编码","图形编码"],"answer":3,"analysis":"考点：信息编码；二维码是通过图形图案存储信息的图形编码","tags":["计算机基础","信息编码"],"difficulty":"容易"},{"id":5,"type":"choice","question":"下列关于ASCII 码的说法中，错误的是","options":["ASCII 码 ( 美 国 信 息 交 换 标 准 代 码 ) 是 一 种 字 符 编 码 ， 使 用 指 定 的 7 位 或 8 位 二 进 制 数组合来表示128或256种可能的字符","标 准 ASCII 码 也 叫 基 础 ASCII 码 ， 使 用 7 位 二 进 制 数 ( 剩 下 的 1 位 二 进 制 为 0 ) 来 表 示所有的大写和小写字母，数字0到9、标点符号及在美式英语中使用的特殊控制字符","ASCII 码的编码值不完全满足正常的排序关系","32～126 (共95个)是字符(32是空格),其中48～57为0到9十个阿拉伯数字， 65～90为26个大写英文字母，97～122号为26个小写英文字母，其余为一些标点符号、运 算符号等"],"answer":2,"analysis":"考点：ASCII码；ASCII码的编码值满足正常的排序关系，如数字<大写字母<小写字母，其余选项均正确","tags":["计算机基础","ASCII码"],"difficulty":"中等"},{"id":6,"type":"choice","question":"存储器的三个性能指标是指速度、容量和","options":["精度","位价","兼容性","时钟频率"],"answer":1,"analysis":"考点：存储器性能；存储器的主要性能指标包括速度、容量和位价（单位容量的价格）","tags":["计算机硬件","存储器"],"difficulty":"中等"},{"id":7,"type":"choice","question":"存储系统采用层次结构，形成缓存-主存和主存-辅存两个存储层次、三级存储系统， 前者解决","options":["层次系统容量问题","CPU 和主存速度不匹配问题","兼容性问题","时间同步问题"],"answer":1,"analysis":"考点：存储层次结构；缓存-主存层次解决CPU与主存速度不匹配问题，主存-辅存层次解决容量问题","tags":["计算机硬件","存储器"],"difficulty":"中等"},{"id":8,"type":"choice","question":"信息技术设备中用于计量存储容量的基本单位是","options":["bit","Byte","KB","ZB"],"answer":1,"analysis":"考点：存储单位；存储容量的基本单位是字节（Byte），bit是最小的信息单位","tags":["计算机基础","存储单位"],"difficulty":"容易"},{"id":9,"type":"choice","question":"下列属于信息系统中输出设备的是","options":["耳麦","耳机","摄像头","触控屏"],"answer":1,"analysis":"考点：输入输出设备；耳机输出声音，属于输出设备；耳麦包含麦克风（输入）和耳机（输出），摄像头是输入设备，触控屏既是输入也是输出","tags":["计算机硬件","输入输出设备"],"difficulty":"中等"},{"id":10,"type":"choice","question":"下列各数中，最大的数是","options":["100D","11D","1001B","1EH"],"answer":0,"analysis":"考点：数制转换；转换为十进制：100D=100，11D=11，1001B=9，1EH=30，最大的是100D","tags":["计算机基础","数制转换"],"difficulty":"容易"},{"id":11,"type":"choice","question":"在拼音输入法中，“学”字的编码为“xue”,  则“xue” 属于汉字编码中的","options":["汉字机内码","汉字输入码","汉字国标码","信息交换码"],"answer":1,"analysis":"考点：汉字编码；拼音输入的编码属于汉字输入码，用于将汉字输入计算机","tags":["计算机基础","汉字编码"],"difficulty":"容易"},{"id":12,"type":"choice","question":"一张照片的存储空间大约为900 KB, 李同学的手机闪存卡为128 GB, 则可以存储 	 张这样的照片。","options":["145","142","131072","149130"],"answer":3,"analysis":"考点：存储容量计算；1GB=1024MB，1MB=1024KB，128GB=128×1024×1024KB=134217728KB，134217728÷900≈149130张","tags":["计算机基础","存储容量"],"difficulty":"中等"},{"id":13,"type":"choice","question":"标称1 TB 的硬盘容量，在计算机中识别的实际容量约为       GB 。","options":["1000","1024","930","700"],"answer":2,"analysis":"考点：硬盘容量；厂商按1TB=1000GB计算，计算机按1TB=1024GB识别，实际容量约为1000×1000×1000×1000÷(1024×1024×1024)≈931GB，约930GB","tags":["计算机硬件","存储器"],"difficulty":"中等"},{"id":14,"type":"choice","question":"计算机在处理信息和数据时，CPU 首先从内存中取出第一条程序指令，通过译码， 按指令的要求，再从        中取出相应的数据，进行指定的运算和逻辑操作等加工，然后按 地址把结果回送到内存中；接下来，再取出第二条程序指令，依次进行，直到遇到指令停止。","options":["CPU","缓存","内存","硬盘"],"answer":2,"analysis":"考点：计算机工作原理；CPU处理数据时，数据需先从外存调入内存，再从内存中取出进行运算","tags":["计算机基础","工作原理"],"difficulty":"中等"},{"id":15,"type":"choice","question":"下列关于信息编码的说法中，正确的是","options":["一个7位二进制数的最高位为1,将其转化十进制的数后的值不会小于64","大写英文字母“X”的 ASCII 码为58H, 则大写字母“Z” 的 ASCII 码为60H","十六进制数71H 与十进制71的值是相等的","根据GB/T   2312—1980标准，“信息”两个汉字的内码共占2个字节"],"answer":0,"analysis":"考点：信息编码；7位二进制最高位为1时，最小值为1000000B=64D，所以不会小于64；X的ASCII码58H，Z应为5AH；71H=113D≠71D；一个汉字内码占2字节，两个汉字占4字节","tags":["计算机基础","信息编码"],"difficulty":"中等"},{"id":16,"type":"judge","question":"最新国产飞机C919 在设计时，通过计算机仿真软件模拟飞行过程中空气动力参数 的变化，进行飞机结构的最优化设计，这体现了信息技术在科学计算方面的应用。","options":["正确","错误"],"answer":1,"analysis":"考点：计算机应用领域；飞机设计仿真属于计算机辅助设计（CAD）应用，而非科学计算","tags":["计算机基础","应用领域"],"difficulty":"中等"},{"id":17,"type":"judge","question":"在我国 ns":["计算机安全","网络安全","信息安全","系统安全"],"answer":2,"analysis":"信息安全是一门综合性学科，涉及计算机科学、网络、通信、密码学等多个领域，直接关系到国家安全、社会稳定和文化传承。","tags":["信息安全基础","基本概念"],"difficulty":"容易"},{"id":2,"type":"choice","question":"下列关于网络安全的说法中，错误的是","options":["防范对网络的攻击、侵入、干扰、破坏、非法使用和意外事故","使网络处于稳定可靠的运行状态","不使用价格低廉的网络设备","保障网络数据的完整性、保密性、可用性"],"answer":2,"analysis":"网络安全与设备价格没有直接关系，关键在于采取有效的防护措施和管理制度。价格低廉的设备只要配置得当、及时更新补丁，也能保障基本安全。","tags":["信息安全基础","网络安全定义"],"difficulty":"容易"},{"id":3,"type":"choice","question":"               是指依据法律规范规定，法律规范关系的参与者应当承担的责任。","options":["权利","权能","义务","担当"],"answer":2,"analysis":"义务是法律规定的法律关系参与者应当履行的责任，与权利相对应。","tags":["信息安全法律","法律责任"],"difficulty":"容易"},{"id":4,"type":"choice","question":"下列关于木马与病毒的区别的说法中，不正确的是","options":["病毒会传染，而木马不会传染","病毒入侵电脑后会有感觉，而中植木马后不会有感觉","病毒能够被安全软件查杀，而木马不会被安全软件查杀","病毒是以“破坏”著称，而木马是用来盗取用户信息"],"answer":2,"analysis":"木马和病毒都能被安全软件查杀，只是木马通常具有更强的隐蔽性，需要更专业的查杀工具。","tags":["恶意代码","木马与病毒区别"],"difficulty":"容易"},{"id":5,"type":"choice","question":"“挂马”就是       通过各种手段获得计算机管理员账号，修改网页加入恶意转向代码，使访问者进入网站后自动进入转向地址或下载恶意代码，继而控制新的计算机。","options":["病毒制作者","黑客","网站管理员","系统测试员"],"answer":1,"analysis":"挂马是黑客常用的攻击手段，通过篡改网页植入恶意代码，控制访问者的计算机。","tags":["恶意代码","挂马概念"],"difficulty":"容易"},{"id":6,"type":"choice","question":"小慧在微信上收到一位聊得来的网友发来的一张精美图片，打开浏览了一下便下载在自己的电脑里面。后来她发现自己保存在电脑上的私密文件被上传到了网站，立即报警，网警经过技术鉴定，认定那张图片上种植了木马，才导致文件被盗。这种利用朋友信任关系设套种植木马的方法是      的利用。","options":["网站“挂马”","域名劫持技术“挂马”","社会工程学","钓鱼网站"],"answer":2,"analysis":"社会工程学利用人的心理弱点，如信任、好奇等，进行攻击。本题中利用朋友信任关系传播木马，是典型的社会工程学攻击。","tags":["网络攻击","社会工程学"],"difficulty":"容易"},{"id":7,"type":"choice","question":"2017年互联网上出现的针对 Windows 操作系统的“勒索”病毒的攻击，这是利用 	 进行的。","options":["系统漏洞","域名劫持技术","社会工程学","钓鱼网站"],"answer":0,"analysis":"2017年爆发的WannaCry勒索病毒利用了Windows操作系统的SMB服务漏洞（永恒之蓝）进行传播。","tags":["恶意代码","系统漏洞"],"difficulty":"容易"},{"id":8,"type":"choice","question":"2020年上半年，国家信息安全漏洞共享平台(CNVD) 新收录网络安全漏洞11073 个，其中高危漏洞占比","options":["26.5%","38.7%","45.4%","51.6%"],"answer":1,"analysis":"根据国家网信办发布的报告，2020年上半年CNVD收录的11073个通用型安全漏洞中，高危漏洞有4280个，占比38.7%。","tags":["信息安全现状","安全漏洞统计"],"difficulty":"中等"},{"id":9,"type":"choice","question":"当前阶段，危及信息安全的主要问题有网页仿冒、垃圾邮件、        、系统漏洞、网站篡改等问题。","options":["网站“挂马”","域名劫持","数据泄露","DDoS 攻击"],"answer":2,"analysis":"数据泄露是当前信息安全面临的主要威胁之一，大量个人和企业数据被泄露，造成严重损失。","tags":["信息安全现状","主要威胁"],"difficulty":"容易"},{"id":10,"type":"choice","question":"恶意代码的主流是","options":["病毒","木马","逻辑炸弹","后门"],"answer":1,"analysis":"随着黑客地下产业链的发展，木马已成为恶意代码的主流，主要用于盗取用户信息和远程控制计算机。","tags":["恶意代码","类型"],"difficulty":"容易"},{"id":11,"type":"judge","question":"计算机病毒是由于卫生条件差从而附着在计算机上的有毒微生物，具有很强的传染性。","options":["正确","错误"],"answer":1,"analysis":"计算机病毒是一种人为编写的恶意程序，不是微生物，通过网络和存储设备传播。","tags":["恶意代码","病毒定义"],"difficulty":"容易"},{"id":12,"type":"judge","question":"黑客“挂马”的主要对象是个人用户计算机。","options":["正确","错误"],"answer":1,"analysis":"黑客挂马的主要对象是网站，通过篡改网站页面植入恶意代码，感染访问该网站的用户计算机。","tags":["恶意代码","挂马对象"],"difficulty":"中等"},{"id":13,"type":"judge","question":"一些新技术，比如人工智能技术、磁盘过滤驱动技术、影像劫持技术、穿透还原技术被广泛应用到恶意代码的编写中，恶意代码的自我保护能力显著增加。","options":["正确","错误"],"answer":0,"analysis":"恶意代码技术不断升级，采用多种新技术增强自我保护能力，躲避安全软件的查杀。","tags":["恶意代码","发展趋势"],"difficulty":"容易"},{"id":14,"type":"judge","question":"有网站通过付费可以购买到VIP 版的QQ 账号和密码，哪怕密码设置相当复杂，也位列其中，说明制造木马、传播木马、盗窃账户信息、第三方平台销赃、洗钱等一整套恶意代码黑色产业链已经形成，我们应经常更新和运行安全查杀软件，避免系统感染木马。","options":["正确","错误"],"answer":0,"analysis":"恶意代码黑色产业链已经形成，分工明确，危害巨大。用户应加强安全防护，及时更新安全软件。","tags":["恶意代码","黑色产业链"],"difficulty":"容易"},{"id":15,"type":"judge","question":"恶意代码制作者利用人们的从众和关注热点事件的心理，通过网络“水军”的带动，诱骗用户浏览挂马网站，借助高点击率快速传播恶意代码。","options":["正确","错误"],"answer":0,"analysis":"恶意代码制作者经常利用社会热点事件，通过网络水军传播恶意链接，诱骗用户访问挂马网站。","tags":["恶意代码","传播方式"],"difficulty":"容易"}]},{"paperId":68,"paperName":"信息安全检测卷（六十二）","questions":[{"id":1,"type":"choice","question":"制作简单逐帧动画时，若要让静态图片连续播放形成动态效果，关键是控制","options":["图片分辨率","帧速率","图片格式","图片大小"],"answer":1,"analysis":"帧速率是指每秒播放的帧数，是形成动态效果的关键。一般来说，帧速率达到24帧/秒以上，人眼就会看到连续的动态效果。","tags":["数字媒体技术","动画制作"],"difficulty":"容易"},{"id":2,"type":"choice","question":"在PowerPoint 中，若要为幻灯片中的多个对象设置统一的动画效果， ":"choice","question":"下列不属于获取图像素材的方法的是","options":["手机拍摄","从网络上下载","利用抓图软件抓取","利用录音软件录制"],"answer":3,"analysis":"录音软件录制的是音频，不是图像素材。","tags":["数字媒体技术","素材获取"],"difficulty":"容易"},{"id":9,"type":"choice","question":"在 PowerPoint   中，为文本添加超链接时，不能链接到","options":["电子邮件","本文档中的其他幻灯片","下一张幻灯片中的音频","现有文件或网页"],"answer":2,"analysis":"超链接不能直接链接到幻灯片中的音频对象，但可以链接到其他幻灯片、电子邮件、现有文件或网页。","tags":["PowerPoint基础","超链接"],"difficulty":"中等"},{"id":10,"type":"choice","question":"在 PowerPoint  中，若要为演示文稿应用统一的主题样式，应在“     ”选项卡中操作。","options":["开始","设计","插入","视图"],"answer":1,"analysis":"主题样式在“设计”选项卡中设置，可以为整个演示文稿应用统一的主题。","tags":["PowerPoint基础","主题设置"],"difficulty":"容易"},{"id":11,"type":"judge","question":"图像处理软件可以在后期对摄影作品进行再加工处理，经调整可以使色彩更鲜艳，但不能使一朵黄花变为红花。","options":["正确","错误"],"answer":1,"analysis":"图像处理软件可以改变图像的颜色，将黄花变为红花。","tags":["数字媒体技术","图像处理"],"difficulty":"容易"},{"id":12,"type":"judge","question":"音频文件的采样率越高，音质越好，文件体积越大。","options":["正确","错误"],"answer":0,"analysis":"采样率是指每秒采集的音频样本数，采样率越高，音质越好，但文件体积也越大。","tags":["数字媒体技术","音频参数"],"difficulty":"容易"},{"id":13,"type":"judge","question":"制作演示文稿时，为了提升效果，应尽量多添加动画和切换效果。","options":["正确","错误"],"answer":1,"analysis":"动画和切换效果应适量使用，过多的动画和切换效果会分散观众的注意力，影响演示效果。","tags":["PowerPoint基础","演示文稿设计"],"difficulty":"容易"},{"id":14,"type":"judge","question":"利用Windows  自带的录音机程序录制的声音文件，默认为MP3 类型。","options":["正确","错误"],"answer":1,"analysis":"Windows自带的录音机程序默认保存为.wma或.m4a格式，不是.mp3格式。","tags":["数字媒体技术","音频录制"],"difficulty":"容易"},{"id":15,"type":"judge","question":"可以用Print    Screen 键截取屏幕图像。","options":["正确","错误"],"answer":0,"analysis":"Print Screen键可以截取整个屏幕图像，Alt+Print Screen键可以截取当前活动窗口图像。","tags":["数字媒体技术","截图操作"],"difficulty":"容易"}]},{"paperId":76,"paperName":"信息安全检测卷（七十）","questions":[{"id":1,"type":"choice","question":"若要想演示文稿文件在没有安装 PowerPoint  的环境下进行播放，则下列方法最好的是","options":["“文件”→“保存”","“幻灯片放映”→“自定义放映”","“文件”→“打包成CD”","带安装包工具，现场安装"],"answer":2,"analysis":"“打包成CD”功能可以将演示文稿和PowerPoint播放器一起打包，生成一个独立的文件夹，在没有安装PowerPoint的环境下也可以播放。","tags":["PowerPoint基础","文件保存"]," 幻灯片放映之后，可以随时退出"],"answer":1,"analysis":"幻灯片放映可以从任意一张开始，也可以从头开始，还可以自定义放映顺序，放映过程中可以随时退出。","tags":["PowerPoint基础","幻灯片放映"],"difficulty":"容易"},{"id":11,"type":"judge","question":"获取图像素材的主要途径有网上下载、数码照相、扫描仪扫描、屏幕截图等。","options":["正确","错误"],"answer":0,"analysis":"这些都是常见的图像素材获取途径。","tags":["数字媒体技术","素材获取"],"difficulty":"容易"},{"id":12,"type":"judge","question":"在 PowerPoint   演示文稿中，若要给所有幻灯片使用相同背景，则在设置背景格式对话框中应单击“全部应用”按钮。","options":["正确","错误"],"answer":0,"analysis":"单击“全部应用”按钮可以将背景设置应用于演示文稿中的所有幻灯片。","tags":["PowerPoint基础","背景设置"],"difficulty":"容易"},{"id":13,"type":"judge","question":"在 PowerPoint    中，为所有幻灯片设置统一的、特有的外观风格，应使用自动版式。","options":["正确","错误"],"answer":1,"analysis":"为所有幻灯片设置统一的外观风格应使用主题，不是自动版式。","tags":["PowerPoint基础","主题设置"],"difficulty":"容易"},{"id":14,"type":"judge","question":"在 PowerPoint  中，为图片添加超链接，可以链接到下一张幻灯片中的图片。","options":["正确","错误"],"answer":1,"analysis":"超链接不能直接链接到幻灯片中的图片对象，但可以链接到包含该图片的幻灯片。","tags":["PowerPoint基础","超链接"],"difficulty":"中等"},{"id":15,"type":"judge","question":"在 PowerPoint      中，要设置幻灯片循环放映，应选择“从头开始放映”。","options":["正确","错误"],"answer":1,"analysis":"设置幻灯片循环放映需要在“设置幻灯片放映”对话框中勾选“循环放映，按ESC键终止”选项，不是选择“从头开始放映”。","tags":["PowerPoint基础","放映设置"],"difficulty":"容易"}]},{"paperId":71,"paperName":"人工智能检测卷（七十一）","questions":[{"id":1,"type":"choice","question":"AI    是 Artificial     Intelligence的缩写，它的含义是","options":["思维导图","人工智能","智能物联","智能技术"],"answer":1,"analysis":"AI是Artificial Intelligence的英文缩写，中文含义为人工智能，是研究、开发用于模拟、延伸和扩展人的智能的技术科学。","tags":["人工智能基础","基本概念"],"difficulty":"容易"},{"id":2,"type":"choice","question":"智能是指","options":["智慧与能力","思想与理念","利用知识解决问题的能力","模仿与创造"],"answer":2,"analysis":"智能的核心定义是利用已有的知识和经验解决实际问题的能力，是人类认知和实践能力的综合体现。","tags":["人工智能基础","智能定义"],"difficulty":"容易"},{"id":3,"type":"choice","question":"人工智能是一门研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的新的","options":["技术科学","研究理论","制造工艺","服务型产品"],"answer":0,"analysis":"人工智能是计算机科学的一个分支，属于技术科学范畴，涵盖理论研究、技术开发和应用系统实现多个层面。","tags":["人工智能基础","学科定位"],"difficulty":"容易"},{"id":4,"type":"choice","question":"人工智能技术本质上是以      为核心，辅以计算机技术来模拟人的智能行为的技术。","options":["自主学习","归纳推理","认知创造","数学算法"],"answer":3,"analysis":"人工智能的核心是数学算法，通过算法对数据进行处理和分析，从而模拟人类的感知、推理、学习等智能行为。","tags":["人工智能基础","技术本质"],"difficulty":"容易"},{"id":5,"type":"choice","question":"人工智能根据实现理解、思考、推理、解决问题的能力，可以分为       两大类。","options":["强人工智能与弱人工智能","制造型人工智能与服务型人工智能","军事人工智能与民用人工智能","“人工智能十生产”和“人工智能+服务”"],"answer":0,"analysis":"按照智能水平和能力范围，人工智能分为强人工智能（通用人工智能）和弱人工智能（专用人工智能）两大类，目前主流应用为弱人工智能。","tags":["人工智能基础","分类"],"difficulty":"容易"},{"id":6,"type":"choice","question":"20世纪70年代，人工智能有应用已经进入医疗、化学、地质等领域，标志着人工智能已经进入","options":["符号推理时代","专家系统时代","深度学习时代","自主应用时代"],"answer":1,"analysis":"人工智能发展经历了三个主要阶段：20世纪50-60年代为符号推理时代，70-80年代为专家系统时代，21世纪以来进入深度学习时代。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":7,"type":"choice","question":"1950年，科学家图灵在论文       中提出了类似“人工智能”的概念。","options":["《 计算机器与智能》","《论数字计算在决断难题中的应用》","《 可计算性与λ可定义性》","《论可计算数及其在判定问题中的应用》"],"answer":0,"analysis":"1950年，艾伦·图灵在《计算机器与智能》一文中提出了著名的“图灵测试”，首次系统探讨了机器是否具有智能的问题。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":8,"type":"choice","question":"下列叙述不正确的是","options":["机器智能可以完全在特定的领域中超越人类智能","机器智能可以有人类智能的创造力","图灵测试混淆了智能和人类的关系","机器智能的机制必须与人类智能相同"],"answer":3,"analysis":"机器智能的实现机制可以与人类智能不同，例如人工智能通过算法和数据模拟智能，而人类智能基于生物神经网络。","tags":["人工智能基础","机器智能"],"difficulty":"中等"},{"id":9,"type":"choice","question":"                ,科学家正式提出“人工智能”一词。","options":["1950      年","1956   年","20    世纪70年代","20   世纪90年代"],"answer":1,"analysis":"1956年，在美国达特茅斯学院召开的会议上，科学家们正式提出了“人工智能”这一术语，标志着人工智能学科的诞生。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":10,"type":"choice","question":"“模式识别”属于人工智能的       研究领域。","options":["符号智能","计算智能","机器学习","机器感知"],"answer":3,"analysis":"机器感知是人工智能的重要研究领域，包括模式识别、计算机视觉、语音识别等，旨在让机器具备感知外界环境的能力。","tags":["人工智能基础","研究领域"],"difficulty":"容易"},{"id":11,"type":"judge","question":"目前部分人工智能领域已经创造出能够完全摆脱人类控制并且达到人类思维的人工智能。比如我国制造的火星探测器“天问一号”历经近10个月的“太空之旅”成功自主着陆于火星乌托邦平原南部。由于距离过于遥远，通信时延单程达20分钟，而整个着陆过程仅9分钟，地球科学家们来不及作任何处置，只能靠天问一号自主完成这“黑色九分钟”,这是人工智能达到人类水平的体现。","options":["正确","错误"],"answer":1,"analysis":"天问一号的自主着陆是弱人工智能在特定任务中的应用，并不具备人类的通用思维能力，也没有完全摆脱人类的预先设计和控制。","tags":["人工智能基础","强人工智能"],"difficulty":"中等"},{"id":12,"type":"judge","question":"人工智能是计算机科学的一个分支，从事这项工作的人只要懂计算机知识就可以了。","options":["正确","错误"],"answer":1,"analysis":"人工智能是一门交叉学科，涉及计算机科学、数学、统计学、神经科学、心理学等多个领域，从事相关工作需要多学科的知识储备。","tags":["人工智能基础","学科特点"],"difficulty":"容易"},{"id":13,"type":"judge","question":"现阶段，人工智能理论研究的主流力量集中于强人工智能方面，并取得了一定的成绩 ，AlphaGo  击败排名世界第一的围棋选手柯洁就是典型实例之一。","options":["正确","错误"],"answer":1,"analysis":"现阶段人工智能研究的主流是弱人工智能（专用人工智能），AlphaGo是专用人工智能的典型代表，强人工智能仍处于理论探索阶段。","tags":["人工智能基础","分类"],"difficulty":"容易"},{"id":14,"type":"judge","question":"人工智能的发展经历了符号推理时代、专家系统时代和深度学习时代三个阶段。","options":["正确","错误"],"answer":0,"analysis":"人工智能的发展历程通常分为三个阶段：1956-1970年的符号推理时代、1970-2000年的专家系统时代、2000年至今的深度学习时代。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":15,"type":"judge","question":"科学家图灵被称为“人工智能之父”。","options":["正确","错误"],"answer":1,"analysis":"被称为“人工智能之父”的是约翰·麦卡锡，他在1956年达特茅斯会议上正式提出了“人工智能”这一术语。图灵被称为“计算机科学之父”和“人工智能之父”的先驱。","tags":["人工智能基础","人物贡献"],"difficulty":"中等"}]},{"paperId":72,"paperName":"人工智能检测卷（七十二）","questions":[{"id":1,"type":"choice","question":"                     是人工智能的核心内容，也是人工智能的基本原理。","options":["符号智能","计算智能","机器学习","机器感知"],"answer":2,"analysis":"机器学习是人工智能的核心，它使计算机能够从数据中学习并改进性能，是实现人工智能的基本方法。","tags":["人工智能基础","机器学习"],"difficulty":"容易"},{"id":2,"type":"choice","question":"“机器人与社会融合”属于人工智能的       知 识 领 域 。","options":["认知与推理","机器人","机器学习","博弈与伦理"],"answer":1,"analysis":"机器人领域研究机器人的设计、制造、控制以及与人类和社会的交互融合，是人工智能的重要应用领域。","tags":["人工智能基础","机器人"],"difficulty":"容易"},{"id":3,"type":"choice","question":"人工智能的工作原理是计算机从通过      收集来的各种不同类型的数据中提取数据特征，抽象出数据模型并进行存储和训练，再利用这些数据模型去分析、探索和预测新的数据，并对新的数据做出相应处理。","options":["传感器","互联网","机器人","嗅探扫描"],"answer":0,"analysis":"人工智能系统通过各种传感器收集外界环境的数据，如图像、声音、温度等，作为学习和决策的基础。","tags":["人工智能基础","工作原理"],"difficulty":"容易"},{"id":4,"type":"choice","question":"推动人工智能前进的必定是","options":["IT   行业专家","数学领域专家","物理领域专家","计算机专业专家"],"answer":1,"analysis":"人工智能的核心是算法，而算法的基础是数学，数学领域的突破是推动人工智能发展的根本动力。","tags":["人工智能基础","学科基础"],"difficulty":"中等"},{"id":5,"type":"choice","question":"机器学习研究的对象是","options":["数据","思维","认知","推理"],"answer":0,"analysis":"机器学习是从数据中自动分析获得规律，并利用规律对未知数据进行预测的技术，其研究对象是数据。","tags":["人工智能基础","机器学习"],"difficulty":"容易"},{"id":6,"type":"choice","question":"机器学习是以       为中心的。","options":["预测分析","抽象计算","模型方法","知识推理"],"answer":2,"analysis":"机器学习的核心是构建数据模型，通过模型对数据进行分析和预测，因此是以模型方法为中心的。","tags":["人工智能基础","机器学习"],"difficulty":"中等"},{"id":7,"type":"choice","question":"机器学习可以分为有监督学习、无监督学习、半监督学习和       四 大类。","options":["自主学习","计划学习","重复学习","强化学习"],"answer":3,"analysis":"机器学习按照学习方式可以分为四大类：有监督学习、无监督学习、半监督学习和强化学习。","tags":["人工智能基础","机器学习分类"],"difficulty":"容易"},{"id":8,"type":"choice","question":"机器学习训练的过程中所要学习的条件概率分布或决策函数，属于机器学习三要素中的","options":["策略","模型","算法","经验"],"answer":1,"analysis":"机器学习的三要素是模型、策略和算法。模型是指要学习的条件概率分布或决策函数，是机器学习的核心。","tags":["人工智能基础","机器学习"],"difficulty":"中等"},{"id":9,"type":"choice","question":"人工智能技术最核心的技术就是","options":["人工智能策略","人工智能模型","人工智能算法","人工智能资源库"],"answer":2,"analysis":"算法是人工智能技术的核心，它决定了人工智能系统的学习能力、推理能力和决策能力。","tags":["人工智能基础","核心技术"],"difficulty":"容易"},{"id":10,"type":"choice","question":"下列算法中，试图通过数字概率来描述人类思考的过程的是","options":["二分查找法","随机森林算法","哈希算法","欧几里得算法"],"answer":1,"analysis":"随机森林算法是一种基于概率统计的机器学习算法，通过多个决策树的投票结果进行预测，模拟了人类基于经验和概率进行决策的过程。","tags":["人工智能基础","机器学习算法"],"difficulty":"中等"},{"id":11,"type":"judge","question":"机器学习是以统计学习来构建模型的，统计学习是概率论、统计学、信息论、计算理论、最优理论及计算机科学等多领域的交叉学科，并且逐渐形成独自的理论体系和方法论。","options":["正确","错误"],"answer":0,"analysis":"统计学习是机器学习的重要基础，它融合了多个学科的理论和方法，形成了独立的理论体系，为机器学习提供了坚实的数学基础。","tags":["人工智能基础","机器学习"],"difficulty":"容易"},{"id":12,"type":"judge","question":"AI 技术在智能手机的应用大致可以分为三类：人机交互、人脸识别和拍照美化。","options":["正确","错误"],"answer":0,"analysis":"AI技术在智能手机中的应用非常广泛，主要包括人机交互（如语音助手）、生物识别（如人脸识别、指纹识别）和图像处理（如拍照美化）三大类。","tags":["人工智能应用","移动应用"],"difficulty":"容易"},{"id":13,"type":"judge","question":"在线翻译、身份验证、语音识别、图像识别等都属于人工智能的典型应用。","options":["正确","错误"],"answer":0,"analysis":"这些都是人工智能技术在不同领域的典型应用：在线翻译属于自然语言处理，身份验证属于生物识别，语音识别和图像识别属于机器感知。","tags":["人工智能应用","典型应用"],"difficulty":"容易"},{"id":14,"type":"judge","question":"人工智能不断改善人类的生活，不断促进经济的发展，人工智能毕竟是人类设计的，不会给人类带来危害，社会上的一些担忧，只是杞人忧天罢了。","options":["正确","错误"],"answer":1,"analysis":"人工智能在带来便利和发展的同时，也带来了安全、伦理、就业等方面的挑战和风险，需要人类进行合理的引导和规范。","tags":["人工智能基础","伦理与安全"],"difficulty":"容易"},{"id":15,"type":"judge","question":"图灵测试是指测试者与被测试者(一个人和一台机器)隔开的情况下，通过一些装置(如键盘)向被测试者随意提问。如果测试者不能确定出被测试者是人还是机器，那么这台机器就通过了测试，并被认为具有人类智能。","options":["正确","错误"],"answer":0,"analysis":"这是图灵测试的标准定义，它是一种用于判断机器是否具有智能的方法。","tags":["人工智能基础","图灵测试"],"difficulty":"容易"}]},{"paperId":73,"paperName":"人工智能检测卷（七十三）","questions":[{"id":1,"type":"choice","question":"              功能是AI 技术在手机上的应用。","options":["人机交互","自动休眠","自动锁屏","亮度调整"],"answer":0,"analysis":"人机交互是AI技术在手机上的重要应用，如语音助手、智能推荐等，而自动休眠、自动锁屏和亮度调整属于手机的基本功能。","tags":["人工智能应用","移动应用"],"difficulty":"容易"},{"id":2,"type":"choice","question":"下列设备中，还不能称之为人工智能在日常生活中应用的是","options":["智能电视","智能空调","智能家居","蓝牙音箱"],"answer":3,"analysis":"蓝牙音箱只是一种音频播放设备，不具备智能感知、学习和决策能力，不属于人工智能应用。","tags":["人工智能应用","日常应用"],"difficulty":"容易"},{"id":3,"type":"choice","question":"机器通过人类发现的问题空间的数据，进行机器学习，具有在人类发现的问题空间中求解的能力，并且求解的过程与结果可以被人类智能      ,此为机器智能的产生。","options":["采纳","参考","理解","认同"],"answer":2,"analysis":"机器智能的产生标志是其求解过程和结果能够被人类智能所理解，这样人类才能对机器的行为进行控制和评估。","tags":["人工智能基础","机器智能"],"difficulty":"中等"},{"id":4,"type":"choice","question":"下列不属于人工智能技术的是","options":["指纹识别","语音识别","人脸识别","自动感应门"],"answer":3,"analysis":"自动感应门只是通过传感器检测物体的存在并自动开关，不具备学习和决策能力，不属于人工智能技术。","tags":["人工智能基础","技术识别"],"difficulty":"容易"},{"id":5,"type":"choice","question":"如果一台机器能够与人类对话而不被辨别出其机器的身份，那么这台机器应具备智能。该设想被称为","options":["人工智能","图灵测试","智能假设","机器学习"],"answer":1,"analysis":"这是图灵测试的核心思想，即通过人机对话来判断机器是否具有智能。","tags":["人工智能基础","图灵测试"],"difficulty":"容易"},{"id":6,"type":"choice","question":"人工智能围棋程序“AlphaGo”战胜了人类的围棋冠军李世石表示人工智能进入 	 时 代 。","options":["深度学习","符号推理","机器人","专家系统"],"answer":0,"analysis":"AlphaGo的成功标志着人工智能进入了深度学习时代，深度学习技术在图像识别、语音识别、自然语言处理等领域取得了重大突破。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":7,"type":"choice","question":"完成无监督学习需要的条件是","options":["物联网和云计算","大数据和物联网","大数据和云计算","互联网和物联网"],"answer":2,"analysis":"无监督学习需要处理大量的无标签数据，这需要大数据提供数据基础和云计算提供计算能力支持。","tags":["人工智能基础","机器学习"],"difficulty":"中等"},{"id":8,"type":"choice","question":"下列关于人工智能的说法中，正确的是","options":["图灵测试用来测试机器是否具有智能","天气数据自动更新属于人工智能","应用了人工智能的机器， 一定比人类更聪明","人工智能的发展在安全、伦理、就业等方面可能会带来新的挑战"],"answer":3,"analysis":"人工智能的发展在带来便利的同时，也会在安全、伦理、就业等方面带来新的挑战和问题，需要我们认真对待。","tags":["人工智能基础","综合认知"],"difficulty":"中等"},{"id":9,"type":"choice","question":"有 一款手机 APP  叫“慧眼识图”,遇到不认识的花朵、植物或者工具等都可以在这里得到完美的答案，根据属性还有特色功效会给你进行详细的讲解，对于车辆的信息也是特别的全面，还可以通过学习制定专属表格，把学到的新知识内容都编辑到里边，从而分享给身边更多的人。这里主要应用了       技术。","options":["虚拟现实","人工智能","增强现实","智慧物联"],"answer":1,"analysis":"“慧眼识图”APP主要应用了人工智能中的图像识别技术，能够识别物体并提供相关信息。","tags":["人工智能应用","图像识别"],"difficulty":"容易"},{"id":10,"type":"choice","question":"小爱音箱与用户的互动主要采用了     技 术 。","options":["图像识别","字符识别","人脸识别","语音识别"],"answer":3,"analysis":"小爱音箱通过语音识别技术理解用户的语音指令，并做出相应的回应，实现人机交互。","tags":["人工智能应用","语音识别"],"difficulty":"容易"},{"id":11,"type":"judge","question":"“深蓝”计算机使用“暴力穷举”算法战胜了国际象棋冠军卡斯帕罗夫。","options":["正确","错误"],"answer":0,"analysis":"1997年，IBM的“深蓝”计算机通过暴力穷举算法，战胜了国际象棋世界冠军卡斯帕罗夫，这是人工智能发展史上的重要里程碑。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":12,"type":"judge","question":"公司考勤部门用的指纹识别机是人工智能的模式识别。","options":["正确","错误"],"answer":0,"analysis":"指纹识别是模式识别技术的典型应用，属于人工智能的机器感知领域。","tags":["人工智能应用","模式识别"],"difficulty":"容易"},{"id":13,"type":"judge","question":"卡内基梅隆大学设计了一套专家系统表示人工智能进入第三个发展阶段。","options":["正确","错误"],"answer":1,"analysis":"专家系统的出现标志着人工智能进入第二个发展阶段（专家系统时代），第三个发展阶段是深度学习时代。","tags":["人工智能基础","发展历程"],"difficulty":"中等"},{"id":14,"type":"judge","question":"设备、网络和数据是人工智能运行的基本条件。","options":["正确","错误"],"answer":0,"analysis":"人工智能系统需要硬件设备提供计算能力，网络提供数据传输，数据提供学习和决策的基础，三者是人工智能运行的基本条件。","tags":["人工智能基础","运行条件"],"difficulty":"容易"},{"id":15,"type":"judge","question":"人工智能通过计算机来模拟人类的某些智能活动，从而取代人的全部能力。","options":["正确","错误"],"answer":1,"analysis":"人工智能只能模拟人类的某些智能活动，辅助人类完成工作，而不能取代人的全部能力。","tags":["人工智能基础","机器智能"],"difficulty":"容易"}]},{"paperId":74,"paperName":"人工智能检测卷（七十四）","questions":[{"id":1,"type":"choice","question":"在京东、淘宝等网络购物平台上，可以直接通过客服机器人获得信息，这是人工智能中        的应用。","options":["智能客服","智能控制","虚拟老师","语音识别"],"answer":0,"analysis":"智能客服是人工智能在电子商务领域的典型应用，通过自然语言处理技术实现与用户的自动对话。","tags":["人工智能应用","智能客服"],"difficulty":"容易"},{"id":2,"type":"choice","question":"深度学习时代依靠的技术是","options":["符号推理","统计概率","数据挖掘","精确计算"],"answer":1,"analysis":"深度学习基于统计概率理论，通过构建多层神经网络，从大量数据中学习特征和规律。","tags":["人工智能基础","深度学习"],"difficulty":"中等"},{"id":3,"type":"choice","question":"某公司的住房销售系统，操作员只需输入客户的需求资料，该系统就会显示该客户所需户型的样图、价位以及相应的楼盘位置，这主要运用了人工智能技术中的","options":["专家系统","人机博弈","数据挖掘","机器翻译"],"answer":0,"analysis":"专家系统是一种模拟人类专家解决特定领域问题的人工智能系统，本题中的住房销售系统就是一个典型的专家系统。","tags":["人工智能应用","专家系统"],"difficulty":"中等"},{"id":4,"type":"choice","question":"下列应用中，体现了人工智能技术的是","options":["2020    年至2022年特殊时期，“健康码”是以真实数据为基础，生成属于个人的二维码","装有传感器的“智能跑车”,自动沿着白线路径行驶","“ 口 袋 动 物 园 ” 是 一 款 基 于AR  技 术 的 儿 童 启 蒙 教 育 APP,  可以呈现立体的、活生生的动物","“世界很复杂，百度更懂你”,百度识图可以实现用户上传图片并在互联网上搜索与该图片相似的其他图片资源"],"answer":3,"analysis":"百度识图应用了人工智能中的图像识别技术，能够识别图片内容并搜索相似图片。","tags":["人工智能应用","图像识别"],"difficulty":"中等"},{"id":5,"type":"choice","question":"要想让机器具有智能，必须让机器具有知识。因此，在人工智能中有一个研究领域，主要研究计算机如何自动获取知识和技能，实现自我完善。这门研究分支学科称为","options":["专家系统","最优化理论","机器学习","统计概率"],"answer":2,"analysis":"机器学习的核心就是让计算机能够自动从数据中获取知识和技能，不断改进性能，实现自我完善。","tags":["人工智能基础","机器学习"],"difficulty":"容易"},{"id":6,"type":"choice","question":"顾客在超市购物时，只要“刷脸”就可以完成支付，这属于人工智能技术中的","options":["专家系统","人脸识别","机器翻译","数据挖掘"],"answer":1,"analysis":"刷脸支付应用了人工智能中的人脸识别技术，通过识别人脸特征来验证用户身份。","tags":["人工智能应用","人脸识别"],"difficulty":"容易"},{"id":7,"type":"choice","question":"智能家居作为一个家庭有机的生态系统是以      为基础的。","options":["无线局域","无线自组网","互联网","物联网"],"answer":3,"analysis":"智能家居以物联网技术为基础，将家中的各种智能设备连接起来，实现远程控制和自动化管理。","tags":["人工智能应用","智能家居"],"difficulty":"容易"},{"id":8,"type":"choice","question":"               中会模拟人类的大脑，形成全连接的神经网络，表现出计算机的“智能”。","options":["有监督学习","无监督学习","半监督学习","强化学习"],"answer":0,"analysis":"有监督学习中的深度学习模型，如全连接神经网络，模拟了人类大脑的神经元连接方式，能够从标注数据中学习复杂的特征。","tags":["人工智能基础","机器学习"],"difficulty":"中等"},{"id":9,"type":"choice","question":"               可以重建人体内器官的三维模型，帮助医生设计手术，确保手术更加精准。","options":["智慧医疗","虚拟老师","深度学习","模式识别"],"answer":0,"analysis":"智慧医疗应用了人工智能和三维重建技术，能够重建人体器官的三维模型，辅助医生进行手术规划和精准治疗。","tags":["人工智能应用","智慧医疗"],"difficulty":"容易"},{"id":10,"type":"choice","question":"下列属于模式识别的是","options":["统计建模、运动规划","图像处理、语音处理","车牌号识别、指纹识别","计算地图上两点之间的最短距离"],"answer":2,"analysis":"模式识别是指对表征事物或现象的各种形式的信息进行处理和分析，以对事物或现象进行描述、辨认、分类和解释的过程。车牌号识别和指纹识别是模式识别的典型应用。","tags":["人工智能基础","模式识别"],"difficulty":"容易"},{"id":11,"type":"judge","question":"半监督学习利用小部分的样本提供预测量的真实值，采用小部分带标签的数据和大量没有标签的数据进行机器学习。","options":["正确","错误"],"answer":0,"analysis":"半监督学习是介于有监督学习和无监督学习之间的一种学习方式，它利用少量带标签的数据和大量无标签的数据进行训练，能够提高学习效率和模型性能。","tags":["人工智能基础","机器学习"],"difficulty":"容易"},{"id":12,"type":"judge","question":"新华社与搜狗公司合作，成功开发了虚拟主播“新小萌”,以新华社主播为原型，栩栩如生地模仿了该主播的言谈举止，“新小萌”的开发主要使用了人工智能技术。","options":["正确","错误"],"answer":0,"analysis":"虚拟主播“新小萌”应用了人工智能中的语音合成、自然语言处理和计算机图形学等技术，能够模拟人类主播的言谈举止。","tags":["人工智能应用","虚拟主播"],"difficulty":"容易"},{"id":13,"type":"judge","question":"数字城市是智慧城市的升级，它通过物联网、云计算、人工智能等新一代信息技术实现城市的全面感知、泛在互联、普适计算与融合应用。","options":["正确","错误"],"answer":1,"analysis":"智慧城市是数字城市的升级，数字城市主要侧重于城市信息的数字化，而智慧城市则通过新一代信息技术实现城市的智能化管理和服务。","tags":["人工智能应用","智慧城市"],"difficulty":"中等"},{"id":14,"type":"judge","question":"智能手表可以用来检测心率、体脂率等参数，来管理身体健康程度，这体现了AI辅助健康监测。","options":["正确","错误"],"answer":0,"analysis":"智能手表通过传感器检测人体的生理参数，并通过AI技术进行分析和管理，实现了辅助健康监测的功能。","tags":["人工智能应用","健康监测"],"difficulty":"容易"},{"id":15,"type":"judge","question":"如果让机器学习认识“猫”,就要给它很多标签里面有猫的照片，它才能知道猫长什么样子。","options":["正确","错误"],"answer":0,"analysis":"这是有监督学习的典型过程，通过给模型提供大量带标签的样本，让模型学习到猫的特征，从而能够识别猫。","tags":["人工智能基础","机器学习"],"difficulty":"容易"}]},{"paperId":75,"paperName":"人工智能检测卷（七十五）","questions":[{"id":1,"type":"choice","question":"深度学习是基于人工神经网络的","options":["有监督学习","半监督学习","无监督学习","强化学习"],"answer":0,"analysis":"深度学习主要基于有监督学习，通过标注数据训练神经网络模型，实现对数据的分类和预测。","tags":["人工智能基础","深度学习"],"difficulty":"中等"},{"id":2,"type":"choice","question":"与人类认知接近，通过观察少数的特征，找到规律，举一反三，推及多数，最后根据总结的规律完成目标任务，这一学习方式称为","options":["有监督学习","无监督学习","半监督学习","强化学习"],"answer":2,"analysis":"半监督学习结合了有监督学习和无监督学习的特点，能够利用少量标注数据和大量无标注数据进行学习，与人类的认知方式较为接近。","tags":["人工智能基础","机器学习"],"difficulty":"中等"},{"id":3,"type":"choice","question":"百度联合罗技公司研发的VOICE   M380语音无线鼠标，让用户免去打字输入的麻烦，并能翻译多种语言，这是采用了百度的","options":["图像识别技术","语音识别技术","机器翻译技术","语音识别技术和机器翻译技术"],"answer":3,"analysis":"该语音无线鼠标同时采用了语音识别技术（将语音转换为文字）和机器翻译技术（将文字翻译为多种语言）。","tags":["人工智能应用","语音识别与翻译"],"difficulty":"容易"},{"id":4,"type":"choice","question":"为了辨认某个物体是不是剪刀，计算机将所有剪刀的图片收集起来，提取其中的特征，将这些特征形成全连接神经网络，总结出什么是剪刀，再辨认该物体是不是剪刀，最后给出答案，这体现了计算机的        的学习方式。","options":["有监督学习","无监督学习","半监督学习","强化学习"],"answer":0,"analysis":"这是有监督学习的典型过程，通过给计算机提供大量标注好的剪刀图片，让计算机学习剪刀的特征，从而能够识别剪刀。","tags":["人工智能基础","机器学习"],"difficulty":"容易"},{"id":5,"type":"choice","question":"采集道路中的车流量、行车速度等信息，经智能系统分析后调整各路口红绿灯时长，下列属于人工智能应用领域的是","options":["智慧物流","智慧灯杆","智能控制","智慧交通"],"answer":3,"analysis":"这是人工智能在智慧交通领域的典型应用，通过智能分析交通数据，优化红绿灯时长，提高交通管理效率。","tags":["人工智能应用","智慧交通"],"difficulty":"容易"},{"id":6,"type":"choice","question":"下列不属于智能研究基本内容的是","options":["机器感知","机器自动化","机器学习","机器思维"],"answer":1,"analysis":"人工智能研究的基本内容包括机器感知、机器学习、机器思维、机器行为等，机器自动化不属于人工智能的研究内容。","tags":["人工智能基础","研究内容"],"difficulty":"中等"},{"id":7,"type":"choice","question":"下列推理不正确的是","options":["若下雨，则地上是湿的；因为没有下雨，所以地上不湿","若 x 是金属，则x 能导电；因为铜是金属，所以铜能导电","若下雨，则地上湿；因为地上不湿，所以没有下雨","小明喜欢可爱的东西，哈士奇可爱，所以小明喜欢哈士奇"],"answer":0,"analysis":"选项A的推理是错误的，因为地上湿不一定是因为下雨，还有其他原因，如洒水等。这是一个典型的逻辑谬误。","tags":["人工智能基础","逻辑推理"],"difficulty":"中等"},{"id":8,"type":"choice","question":"太阳从东边升起是","options":["可能事件","不可能事件","必然事件","不确定事件"],"answer":2,"analysis":"太阳从东边升起是客观规律，是必然会发生的事件。","tags":["人工智能基础","概率统计"],"difficulty":"容易"},{"id":9,"type":"choice","question":"人通过算法赋给机器的智能属于","options":["自然智能空间","认识智能空间","物物智能空间","人工智能空间"],"answer":3,"analysis":"人通过算法赋给机器的智能属于人工智能空间，是人类智能的延伸和扩展。","tags":["人工智能基础","智能空间"],"difficulty":"中等"},{"id":10,"type":"choice","question":"在淘宝搜索“华为手机”这一商品，淘宝会自动推荐“华为手机”的相关商品，这体现了","options":["淘宝利用大数据为客户推荐商品","会自动按曾经购买人数(人气)排序","淘宝利用了智能客服主动推荐商品","淘宝推荐的商品可按价位高低排序"],"answer":0,"analysis":"淘宝的商品推荐功能利用了大数据和人工智能技术，通过分析用户的搜索和购买行为，为用户推荐相关商品。","tags":["人工智能应用","大数据推荐"],"difficulty":"容易"},{"id":11,"type":"judge","question":"人工智能的发展仅经历了深度学习一个阶段，直接实现了从理论到实用的跨越。","options":["正确","错误"],"answer":1,"analysis":"人工智能的发展经历了符号推理时代、专家系统时代和深度学习时代三个阶段，是一个逐步发展和完善的过程。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":12,"type":"judge","question":"1959年，约瑟夫 · 恩格尔伯格利用乔治 ·德沃尔的专利技术，研制出世界上第一台真正意义上的工业机器人“Unimate” 。","options":["正确","错误"],"answer":0,"analysis":"1959年，约瑟夫·恩格尔伯格和乔治·德沃尔共同研制出了世界上第一台工业机器人“Unimate”，开创了机器人发展的新纪元。","tags":["人工智能基础","机器人发展"],"difficulty":"容易"},{"id":13,"type":"judge","question":"2017年世界级“网红”Sophia(索菲亚)在沙特阿拉伯首都利雅得举行的“未来投资倡议”大会上获得了沙特公民身份。","options":["正确","错误"],"answer":0,"analysis":"2017年，机器人索菲亚获得了沙特阿拉伯的公民身份，成为世界上第一个获得公民身份的机器人。","tags":["人工智能应用","机器人"],"difficulty":"容易"},{"id":14,"type":"judge","question":"第二代智能机器人是指能够利用各种传感器、测量器等来获取环境信息，然后利用智能技术进行识别、理解、推理，最后做出规划决策，是通过自主行动实现预定目标的高级机器人。","options":["正确","错误"],"answer":1,"analysis":"这是第三代智能机器人的特点。第二代智能机器人是感知机器人，能够利用传感器获取环境信息，但不具备自主决策能力。","tags":["人工智能基础","机器人发展"],"difficulty":"中等"},{"id":15,"type":"judge","question":"机器人的发展趋势之一是小型化、智能化，能够适应更复杂的工作环境。","options":["正确","错误"],"answer":0,"analysis":"随着技术的发展，机器人正朝着小型化、智能化、柔性化的方向发展，能够适应更加复杂和多样化的工作环境。","tags":["人工智能基础","机器人发展"],"difficulty":"容易"}]},{"paperId":76,"paperName":"人工智能检测卷（七十六）","questions":[{"id":1,"type":"choice","question":"机器人是一种具备一些与人或生物相似的智能能力的具有高度灵活性的","options":["半自动化机器","自动化机器","智能设备","格斗性装备"],"answer":1,"analysis":"机器人是一种能够自动执行任务的自动化机器，具备一些与人或生物相似的智能能力，如感知、推理、学习等。","tags":["人工智能基础","机器人定义"],"difficulty":"容易"},{"id":2,"type":"choice","question":"推理与决策体现了机器人具有        的 特 征 。","options":["通用性","攻击性","独立性","智能性"],"answer":3,"analysis":"推理与决策是智能的核心体现，机器人具备推理与决策能力，说明它具有智能性特征。","tags":["人工智能基础","机器人特征"],"difficulty":"容易"},{"id":3,"type":"choice","question":"春秋时代鲁班发明        ,这是有记载的世界上第一台空中机器人。","options":["木牛流马","指南车","木鸟","计里鼓车"],"answer":2,"analysis":"春秋时代鲁班发明的木鸟能够在空中飞行，是有记载的世界上第一台空中机器人。","tags":["人工智能基础","机器人历史"],"difficulty":"容易"},{"id":4,"type":"choice","question":"“机器人”Robot 一词，源自1920年捷克剧作家创作的剧本","options":["《 罗萨姆的万能机器人》","《机器人海达 · 高布乐》","《 三姊妹：人形机器人版》","《从头开始》"],"answer":0,"analysis":"“机器人”一词源自1920年捷克剧作家卡雷尔·恰佩克的剧本《罗萨姆的万能机器人》。","tags":["人工智能基础","机器人历史"],"difficulty":"容易"},{"id":5,"type":"choice","question":"1942年，为了预防机器人的出现可能引发的人类灾难，美国科幻小说家在《我，机器人》的第4个短篇《转圈圈》中，首次提出了       ,被称为“现代机器人学的基石”。","options":["机器人设计准则","机器人通用标准","机器人学3原则","机器人的万能世界"],"answer":2,"analysis":"1942年，美国科幻小说家艾萨克·阿西莫夫在《我，机器人》中首次提出了“机器人学三定律”，被称为“现代机器人学的基石”。","tags":["人工智能基础","机器人伦理"],"difficulty":"容易"},{"id":6,"type":"choice","question":"被称为“机器人之父”的是","options":["卡雷尔 · 恰佩克","约瑟夫 ·恩格尔伯格","乔治 · 德沃尔","马文 · 明斯基"],"answer":1,"analysis":"约瑟夫·恩格尔伯格被誉为“机器人之父”，他研制出了世界上第一台工业机器人，开创了机器人产业。","tags":["人工智能基础","人物贡献"],"difficulty":"容易"},{"id":7,"type":"choice","question":"               公司曾改造出世界上第一台机电驱动的6轴产业机器人，同时开发出第一台娱乐机器人Robocoaster 。","options":["美国Unimation","通用汽车","美国 TRC","德国库卡"],"answer":3,"analysis":"德国库卡公司是世界著名的机器人制造商，曾改造出世界上第一台机电驱动的6轴产业机器人，并开发出第一台娱乐机器人Robocoaster。","tags":["人工智能基础","机器人发展"],"difficulty":"中等"},{"id":8,"type":"choice","question":"2008年，世界上第一例机器人切除脑瘤手术成功，施行手术的是卡尔加里大学医学院研制的","options":["医疗机器人","神经臂","手术助理","智能手续刀"],"answer":1,"analysis":"2008年，加拿大卡尔加里大学医学院研制的“神经臂”机器人成功完成了世界上第一例机器人切除脑瘤手术。","tags":["人工智能应用","医疗机器人"],"difficulty":"中等"},{"id":9,"type":"choice","question":"世界上首位获得公民身份的机器人是","options":["世界级“网红”Sophia (索菲亚)","Pepper","Ava","Jia    Jia"],"answer":0,"analysis":"2017年，机器人索菲亚获得了沙特阿拉伯的公民身份，成为世界上首位获得公民身份的机器人。","tags":["人工智能应用","机器人"],"difficulty":"容易"},{"id":10,"type":"choice","question":"按控制系统技术水平分类，扫地机器人属于","options":["示教再现机器人","感知机器人","智能机器人","超级机器人"],"answer":1,"analysis":"扫地机器人能够通过传感器感知周围环境，自动规划清扫路径，属于感知机器人。","tags":["人工智能基础","机器人分类"],"difficulty":"中等"},{"id":11,"type":"judge","question":"军事机器人可以去探索宇宙的奥秘，为人类实现遨游太空、移居外星球的理想。","options":["正确","错误"],"answer":1,"analysis":"探索宇宙奥秘的是空间机器人，军事机器人主要用于军事领域，执行侦察、作战等任务。","tags":["人工智能应用","机器人分类"],"difficulty":"容易"},{"id":12,"type":"judge","question":"若想探寻海底三千米深度的海洋环境，应使用水下机器人。","options":["正确","错误"],"answer":0,"analysis":"水下机器人能够在深海环境中工作，代替人类进行海洋探测、资源开发等任务。","tags":["人工智能应用","机器人"],"difficulty":"容易"},{"id":13,"type":"judge","question":"机器人的外形与人的外形高度类似。","options":["正确","错误"],"answer":1,"analysis":"机器人的外形多种多样，不一定与人的外形高度类似，如工业机器人、扫地机器人等。","tags":["人工智能基础","机器人特征"],"difficulty":"容易"},{"id":14,"type":"judge","question":"人工智能在教育领域的应用仅包括智能题库，无法实现个性化学习推荐。","options":["正确","错误"],"answer":1,"analysis":"人工智能在教育领域的应用非常广泛，包括智能题库、个性化学习推荐、智能辅导、虚拟教师等。","tags":["人工智能应用","教育应用"],"difficulty":"容易"},{"id":15,"type":"judge","question":"工业机器人与服务机器人的核心区别在于应用场景，工业机器人更侧重重复化、高精度作业。","options":["正确","错误"],"answer":0,"analysis":"工业机器人主要应用于工业生产领域，侧重重复化、高精度的作业；服务机器人主要应用于服务领域，侧重与人的交互和服务。","tags":["人工智能基础","机器人分类"],"difficulty":"容易"}]},{"paperId":77,"paperName":"人工智能检测卷（七十七）","questions":[{"id":1,"type":"choice","question":"按控制系统技术水平分类，酒店机器人属于","options":["示教再现机器人","感知机器人","智能机器人","超级机器人"],"answer":1,"analysis":"酒店机器人能够通过传感器感知环境，识别客人，提供引导、送餐等服务，属于感知机器人。","tags":["人工智能基础","机器人分类"],"difficulty":"中等"},{"id":2,"type":"choice","question":"关节型机器人的动作和功能类似人类的手臂，这是针对机器人按       进行分类的。","options":["控制系统技术水平","机械结构形态","运动控制方式","应用"],"answer":1,"analysis":"关节型机器人是按照机械结构形态进行分类的，其结构类似人类的手臂，具有多个关节，灵活性高。","tags":["人工智能基础","机器人分类"],"difficulty":"容易"},{"id":3,"type":"choice","question":"按照国际机器人联合会(IFR)  的分类方法，军事机器人属于","options":["特种机器人","智能机器人","工业机器人","服务机器人"],"answer":0,"analysis":"国际机器人联合会将机器人分为工业机器人和服务机器人两大类，军事机器人属于特种机器人，是服务机器人的一个子类。","tags":["人工智能基础","机器人分类"],"difficulty":"中等"},{"id":4,"type":"choice","question":"下列各组选项中，都属于工业机器人的是","options":["喷涂机器人、装配机器人、焊接机器人和分拣机器人","喷涂机器人、焊接机器人、住宅安全机器人和物流机器人","输送机器人、建筑机器人、包装机器人和码垛机器人","装配机器人、焊接机器人、场地机器人和装卸机器人"],"answer":0,"analysis":"工业机器人主要应用于工业生产领域，包括喷涂、装配、焊接、分拣、搬运等。住宅安全机器人、物流机器人、建筑机器人、场地机器人属于服务机器人。","tags":["人工智能基础","机器人分类"],"difficulty":"中等"},{"id":5,"type":"choice","question":"下列不属于军事机器人的是","options":["AIBO   机器狗","FPV  无人机","“幽灵 V60”机器狗","大狗机器人(Bigdog)"],"answer":0,"analysis":"AIBO机器狗是索尼公司开发的娱乐机器人，不属于军事机器人。","tags":["人工智能基础","机器人分类"],"difficulty":"容易"},{"id":6,"type":"choice","question":"下列技术中，属于人工智能进入深度学习时代的标志性应用的是","options":["专家系统辅助医疗诊断","AlphaGo     战胜围棋世界冠军","早期符号推理机器人","语音识别技术实现文字转换"],"answer":1,"analysis":"AlphaGo战胜围棋世界冠军是人工智能进入深度学习时代的标志性事件，标志着深度学习技术在复杂任务中取得了重大突破。","tags":["人工智能基础","发展历程"],"difficulty":"容易"},{"id":7,"type":"choice","question":"下列属于人工智能在智慧农业领域的典型应用是","options":["工业机器人焊接汽车零部件","智能巡检机器人监测电网","植保无人机精准喷洒农药","服务机器人提供酒店客房服务"],"answer":2,"analysis":"植保无人机精准喷洒农药是人工智能在智慧农业领域的典型应用，能够提高农业生产效率，减少农药使用。","tags":["人工智能应用","智慧农业"],"difficulty":"容易"},{"id":8,"type":"choice","question":"第三代智能机器人是依靠人工智能技术决策行动的机器人，它们根据感觉到的信息，进行        ,并作出判断和决策，不用人的参与就可以完成一些复杂的工作。","options":["自动重复","识别判断","一定感知","独立思维"],"answer":1,"analysis":"第三代智能机器人能够根据传感器获取的信息进行识别判断，并自主做出决策，完成复杂的任务。","tags":["人工智能基础","机器人发展"],"difficulty":"中等"},{"id":9,"type":"choice","question":"我国自主研发的火星探测器“天问一号”实现自主着陆火星，其核心技术支撑属于人工智能中的","options":["符号推理","强化学习","计算机视觉","自主决策与控制"],"answer":3,"analysis":"天问一号的自主着陆主要依靠自主决策与控制技术，能够在复杂的环境中自主完成着陆过程。","tags":["人工智能应用","航天应用"],"difficulty":"中等"},{"id":10,"type":"choice","question":"20世纪70年代末，机器人技术才得到巨大发展；80年代，计算机技术和传感器的发展推动了机器人的发展，它们都具有一定的       能力；90年代，小型轻型机器人开始出现，这类机器人能在特殊的环境中完成给定的任务。","options":["交互","感应","识别判断","智能识别"],"answer":1,"analysis":"80年代的机器人主要是感知机器人，具有一定的感应能力，能够通过传感器获取环境信息。","tags":["人工智能基础","机器人发展"],"difficulty":"中等"},{"id":11,"type":"judge","question":"人工智能在医学影像分析方面，可以起到计算机辅助诊断的作用，可以进行病灶检测、病灶量化诊断、治疗决策等。","options":["正确","错误"],"answer":0,"analysis":"人工智能在医学影像分析方面具有广泛的应用，能够辅助医生进行病灶检测、量化诊断和治疗决策，提高诊断的准确性和效率。","tags":["人工智能应用","智慧医疗"],"difficulty":"容易"},{"id":12,"type":"judge","question":"人工智能技术在自动驾驶中的应用，完全不需要人类干预就能实现全场景安全行驶。","options":["正确","错误"],"answer":1,"analysis":"目前的自动驾驶技术还处于发展阶段，还不能完全实现全场景的自动驾驶，在复杂的环境中仍然需要人类的干预。","tags":["人工智能应用","自动驾驶"],"difficulty":"容易"},{"id":13,"type":"judge","question":"从应用环境出发，当代机器人大军中最主要的机器人为特种机器人。","options":["正确","错误"],"answer":1,"analysis":"从应用环境出发，当代机器人大军中最主要的机器人是工业机器人，广泛应用于各个工业领域。","tags":["人工智能基础","机器人分类"],"difficulty":"容易"},{"id":14,"type":"judge","question":"医疗机器人启用的人工智能系统 Watson   曾经只用了10分钟就从2000万份论文中找到了依据，精确诊断了病症。","options":["正确","错误"],"answer":0,"analysis":"IBM的Watson人工智能系统在医疗领域具有强大的能力，能够快速分析大量的医学文献和数据，辅助医生进行诊断。","tags":["人工智能应用","智慧医疗"],"difficulty":"容易"},{"id":15,"type":"judge","question":"军事机器人可以去探索宇宙的奥秘，为人类实现遨游太空、移居外星球的理想。","options":["正确","错误"],"answer":1,"analysis":"探索宇宙奥秘的是空间机器人，军事机器人主要用于军事领域，执行侦察、作战等任务。","tags":["人工智能应用","机器人分类"],"difficulty":"容易"}]},{"paperId":78,"paperName":"人工智能检测卷（七十八）","questions":[{"id":1,"type":"choice","question":"智能家居中扫地机器人在扫地的过程中能够识别到障碍物并自主进行规避，是因为安装在前进方向的        识别到障碍物。","options":["摄像头","传感器","录音装置","红外扫描仪"],"answer":1,"analysis":"扫地机器人通过各种传感器（如红外传感器、超声波传感器）识别障碍物，并自主进行规避。","tags":["人工智能应用","智能家居"],"difficulty":"容易"},{"id":2,"type":"choice","question":"下列属于工业机器人特点的是","options":["能够长时间从事单调的动作","不怕累，不怕苦","具有与人接近的思维","具有机械腿，能行走"],"answer":0,"analysis":"工业机器人的主要特点是能够长时间、高精度地从事单调重复的动作，提高生产效率和质量。","tags":["人工智能基础","机器人特点"],"difficulty":"容易"},{"id":3,"type":"choice","question":"有些工作环境气味难闻、挥发性强、易燃易爆，对人体有很大危害，       结 构 简单，无论何种情况下都能保证工作质量，而且机器人自带防爆系统，可保证工作安全可靠。","options":["喷涂机器人","焊接机器人","研磨抛光机器人","码垛机器人"],"answer":0,"analysis":"喷涂机器人主要用于喷涂作业，能够在恶劣的环境中工作，自带防爆系统，保证工作安全。","tags":["人工智能应用","工业机器人"],"difficulty":"容易"},{"id":4,"type":"choice","question":"在农业领域的生产环节，智能的       可以利用图像识别技术获取农作物的生长状况，判断哪些杂草需要清除，哪里需要灌溉、施肥、打药，并立即执行。","options":["场地机器人","森林机器人","农业机器人","输送机器人"],"answer":2,"analysis":"农业机器人能够利用图像识别技术获取农作物的生长状况，自动进行除草、灌溉、施肥、打药等作业，提高农业生产效率。","tags":["人工智能应用","智慧农业"],"difficulty":"容易"},{"id":5,"type":"choice","question":"2020年12月，嫦娥五号探测器在月球表面完成自动采样，并携带月球样品成功返回着陆，它属于","options":["海洋机器人","空间机器人","核工业机器人","火星探测机器人"],"answer":1,"analysis":"嫦娥五号探测器是用于月球探测的空间机器人，能够在月球表面自动采样并返回地球。","tags":["人工智能应用","航天应用"],"difficulty":"容易"},{"id":6,"type":"choice","question":"消防机器人能够通过      发现火场。","options":["声音传感器","气压传感器","火焰传感器","碰撞传感器"],"answer":2,"analysis":"消防机器人通过火焰传感器检测火焰，从而发现火场，执行灭火任务。","tags":["人工智能应用","特种机器人"],"difficulty":"容易"},{"id":7,"type":"choice","question":"智能机器人索菲亚(Sophia)  不仅可以模仿人的一举一动和面部表情，甚至拥有灵敏的反应能力，能够与人进行正常的对话和交流。下列说法正确的是","options":["智能机器人的能力已经完全超越了人类的能力","智能机器人是人类意识发展到一定阶段的产物","智能机器人可以拥有与人一样的自主意识","智能机器人的系统由人设定，但有别于人类意识"],"answer":3,"analysis":"智能机器人的系统是由人类设计和设定的，它能够模拟人类的某些智能行为，但不具备人类的自主意识和情感。","tags":["人工智能基础","机器人智能"],"difficulty":"中等"},{"id":8,"type":"choice","question":"智能家居是通过      技术将家中的各种智能设备(如音视频设备、照明系统、窗帘控制、网络、家电等)连接到一起。","options":["物联网","互联网","局域网","城域网"],"answer":0,"analysis":"智能家居以物联网技术为基础，将家中的各种智能设备连接起来，实现远程控制和自动化管理。","tags":["人工智能应用","智能家居"],"difficulty":"容易"},{"id":9,"type":"choice","question":"下列选项中，没有体现人工智能的应用的是","options":["某软件将输入的语音自动转换为文字","机器人导游回答游客的问题，并提供帮助","门禁系统通过指纹识别确认身份","通过键盘输入商品编码，屏幕上显示出相应价格"],"answer":3,"analysis":"通过键盘输入商品编码，屏幕上显示出相应价格，这是一个简单的数据库查询操作，没有体现人工智能技术。","tags":["人工智能基础","技术识别"],"difficulty":"中等"},{"id":10,"type":"choice","question":"“人工昆虫”是        的雏形。","options":["扫地机器人","物流机器人","建筑机器人","酒店机器人"],"answer":1,"analysis":"“人工昆虫”是一种微型机器人，具有体积小、灵活性高的特点，是未来物流机器人的雏形，可用于复杂环境下的货物运输。","tags":["人工智能基础","机器人发展"],"difficulty":"中等"},{"id":11,"type":"judge","question":"人工智能在医学影像分析方面，可以起到计算机辅助诊断的作用，可以进行病灶检测、病灶量化诊断、治疗决策等。","options":["正确","错误"],"answer":0,"analysis":"人工智能在医学影像分析方面具有广泛的应用，能够辅助医生进行病灶检测、量化诊断和治疗决策，提高诊断的准确性和效率。","tags":["人工智能应用","智慧医疗"],"difficulty":"容易"},{"id":12,"type":"judge","question":"人工智能技术在自动驾驶中的应用，完全不需要人类干预就能实现全场景安全行驶。","options":["正确","错误"],"answer":1,"analysis":"目前的自动驾驶技术还处于发展阶段，还不能完全实现全场景的自动驾驶，在复杂的环境中仍然需要人类的干预。","tags":["人工智能应用","自动驾驶"],"difficulty":"容易"},{"id":13,"type":"judge","question":"从应用环境出发，当代机器人大军中最主要的机器人为特种机器人。","options":["正确","错误"],"answer":1,"analysis":"从应用环境出发，当代机器人大军中最主要的机器人是工业机器人，广泛应用于各个工业领域。","tags":["人工智能基础","机器人分类"],"difficulty":"容易"},{"id":14,"type":"judge","questio // 自动分卷函数
function splitBigPaper(bigPaperName, questions, perCount=20){
    let papers = [];
    for(let i=0; i<questions.length; i+=perCount){
        papers.push({paperId:9000+(i/perCount+1),paperName:`${bigPaperName}-第${i/perCount+1}套`,questions:questions.slice(i,i+perCount)});
    }
    return papers;
}

let allPapers = [...questionPapers];
let allQuestions = allPapers.flatMap(p=>p.questions);

// ===================== 全局状态 =====================
let currentMode = 'seq';
let currentList = [];
let currentIndex = 0;
let userAnswers = {};
let examAnswers = {};

// ===================== 初始化 =====================
document.addEventListener('DOMContentLoaded', () => {
    renderPaperSelector();
    bindTabEvents();
    initMode('seq');
});

// 绑定选项卡切换
function bindTabEvents(){
    document.querySelectorAll('.nav-link').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            initMode(btn.dataset.mode);
        });
    });
}

// 渲染套卷选择器
function renderPaperSelector(){
    const sel = document.getElementById('paperSelector');
    sel.innerHTML = '<option value="0">请选择套卷</option>';
    allPapers.forEach(p=>{
        const opt = document.createElement('option');
        opt.value = p.paperId;
        opt.innerText = p.paperName;
        sel.appendChild(opt);
    });
}

// 切换套卷
function changePaper(){
    const pid = parseInt(document.getElementById('paperSelector').value);
    if(!pid) return;
    const paper = allPapers.find(p=>p.paperId === pid);
    currentList = [...paper.questions];
    currentIndex = 0;
    userAnswers = {};
    renderQuestion();
}

// ===================== 模式初始化 =====================
function initMode(mode){
    currentMode = mode;
    currentIndex = 0;
    userAnswers = {};
    examAnswers = {};

    document.getElementById('practice-area').classList.add('d-none');
    document.getElementById('exam-area').classList.add('d-none');
    document.getElementById('paperSelector').classList.add('d-none');
    document.getElementById('progress-box').classList.add('d-none');
    document.getElementById('progress-text').classList.add('d-none');
    document.getElementById('topic-settings').classList.add('d-none');
    document.getElementById('feedback-area').classList.add('d-none');
    document.getElementById('random-refresh-btn').classList.add('d-none');
    document.getElementById('exam-generate-btn').classList.add('d-none');

    if(mode === 'seq'){
        document.getElementById('mode-title').innerText = '顺序练习（选择套卷）';
        document.getElementById('practice-area').classList.remove('d-none');
        document.getElementById('paperSelector').classList.remove('d-none');
        document.getElementById('progress-box').classList.remove('d-none');
        document.getElementById('progress-text').classList.remove('d-none');
        changePaper();
    }

    if(mode === 'random'){
        document.getElementById('mode-title').innerText = '随机练习（全库）';
        document.getElementById('practice-area').classList.remove('d-none');
        document.getElementById('progress-box').classList.remove('d-none');
        document.getElementById('progress-text').classList.remove('d-none');
        document.getElementById('random-refresh-btn').classList.remove('d-none');
        refreshRandom();
    }

    if(mode === 'topic'){
        document.getElementById('mode-title').innerText = '专题练习';
        document.getElementById('practice-area').classList.remove('d-none');
        document.getElementById('topic-settings').classList.remove('d-none');
        renderTags();
    }

    if(mode === 'exam'){
        document.getElementById('mode-title').innerText = '模拟考试';
        document.getElementById('exam-area').classList.remove('d-none');
        document.getElementById('exam-generate-btn').classList.remove('d-none');
        document.getElementById('exam-list').innerHTML = '<p class="text-center">点击【生成试卷】开始考试</p>';
    }
}

// 随机练习：刷新抽题
function refreshRandom(){
    currentList = shuffleArray([...allQuestions]);
    currentIndex = 0;
    userAnswers = {};
    renderQuestion();
}

// ===================== 专题练习 =====================
function renderTags(){
    const container = document.getElementById('tag-container');
    container.innerHTML = '';
    const tags = [...new Set(allQuestions.flatMap(q=>q.tags))].sort();
    tags.forEach(tag=>{
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-primary btn-sm m-1 tag-btn';
        btn.innerText = tag;
        btn.onclick = e=>{
            e.target.classList.toggle('active');
            e.target.classList.toggle('bg-primary');
            e.target.classList.toggle('text-white');
        };
        container.appendChild(btn);
    });
}

function startTopicPractice(){
    const selected = Array.from(document.querySelectorAll('.tag-btn.active')).map(b=>b.innerText);
    if(!selected.length){ alert('请选择至少一个标签'); return; }
    currentList = shuffleArray(allQuestions.filter(q=>q.tags.some(t=>selected.includes(t))));
    currentIndex = 0;
    userAnswers = {};
    document.getElementById('topic-settings').classList.add('d-none');
    document.getElementById('progress-box').classList.remove('d-none');
    document.getElementById('progress-text').classList.remove('d-none');
    renderQuestion();
}

// ===================== 模拟考试 =====================
function generateExamPaper(){
    examAnswers = {};
    currentList = shuffleArray([...allQuestions]).slice(0, 18);
    renderExamPaper();
}

function renderExamPaper(){
    const container = document.getElementById('exam-list');
    container.innerHTML = '';
    
    currentList.forEach((q, idx)=>{
        const div = document.createElement('div');
        div.className = 'exam-question';
        let typeLabel = q.type === 'choice' ? '<span class="badge bg-info me-2">单选</span>' : '<span class="badge bg-warning me-2">判断</span>';
        let optionsHtml = '';

        q.options.forEach((opt, i)=>{
            const label = String.fromCharCode(65+i);
            optionsHtml += `
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="exam-${idx}" id="q-exam-${idx}-${i}" value="${i}" onchange="selectExamAnswer(${idx},${i})">
                <label class="form-check-label" for="q-exam-${idx}-${i}">${label}. ${opt}</label>
            </div>`;
        });

        div.innerHTML = `<h6>第${idx+1}题 ${typeLabel} ${q.question}</h6><div class="mt-2">${optionsHtml}</div>`;
        container.appendChild(div);
    });
}

function selectExamAnswer(index, ans){
    examAnswers[index] = ans;
}

// 提交试卷（自定义DIV弹窗，修复无响应）
function submitExam(){
    if(currentList.length === 0){
        alert('请先点击【生成试卷】！');
        return;
    }
    if(Object.keys(examAnswers).length < currentList.length){
        alert('请完成所有题目再提交！');
        return;
    }

    let correct = 0;
    let result = `<h3 class="text-center mb-4">📝 考试判分报告</h3><hr>`;
    currentList.forEach((q,i)=>{
        const userAns = examAnswers[i];
        const rightAns = q.answer;
        const isRight = userAns === rightAns;
        if(isRight) correct++;
        
        const qType = q.type === 'choice' ? '单选题' : '判断题';
        const userOpt = String.fromCharCode(65+userAns);
        const rightOpt = String.fromCharCode(65+rightAns);
        result += `<p>${i+1}.${qType}：${isRight ? '<span class="text-success">✅ 正确</span>' : '<span class="text-danger">❌ 错误</span>'} | 你的答案：${userOpt} | 正确答案：${rightOpt}</p>`;
    });
    
    const score = Math.round(correct/currentList.length*100);
    result += `<hr><h4 class="text-center">🎯 总分：${score}分 | ✅ 做对：${correct}题 | ❌ 做错：${currentList.length-correct}题</h4>`;
    
    document.getElementById('scoreResult').innerHTML = result;
    document.getElementById('scoreModal').style.display = 'flex';
}

// 关闭弹窗
function closeScoreModal(){
    document.getElementById('scoreModal').style.display = 'none';
}

// ===================== 逐题练习渲染 =====================
function renderQuestion(){
    if(!currentList.length) return;
    const q = currentList[currentIndex];
    updateProgress();

    document.getElementById('q-type').innerText = q.type==='choice'?'单选题':'判断题';
    document.getElementById('q-type').className = q.type==='choice'?'badge bg-info':'badge bg-warning';
    document.getElementById('q-content').innerText = `${q.id}. ${q.question}`;

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';

    q.options.forEach((opt,i)=>{
        const btn = document.createElement('button');
        const label = String.fromCharCode(65+i);
        let cls = 'btn btn-outline-primary option-btn';
        
        if(userAnswers[currentIndex] !== undefined){
            btn.disabled = true;
            if(i === q.answer) cls = 'btn btn-success option-btn';
            else if(userAnswers[currentIndex] === i) cls = 'btn btn-danger option-btn';
        }

        btn.className = cls;
        btn.innerHTML = `<strong>${label}.</strong> ${opt}`;
        btn.onclick = ()=>{ userAnswers[currentIndex]=i; renderQuestion(); showAnswer(q); };
        optBox.appendChild(btn);
    });

    userAnswers[currentIndex]!==undefined ? showAnswer(q) : document.getElementById('feedback-area').classList.add('d-none');
}

function showAnswer(q){
    const area = document.getElementById('feedback-area');
    const flag = document.getElementById('correct-flag');
    const analysis = document.getElementById('q-analysis');
    area.classList.remove('d-none');

    if(userAnswers[currentIndex] === q.answer){
        flag.className = 'alert alert-success';
        flag.innerText = '✅ 回答正确';
    }else{
        flag.className = 'alert alert-danger';
        const ans = String.fromCharCode(65+q.answer);
        flag.innerText = `❌ 错误，正确答案：${ans}`;
    }
    analysis.innerText = q.analysis || '无解析';
}

function nextQuestion(){ 
    currentIndex < currentList.length-1 ? (currentIndex++, renderQuestion()) : alert('已到最后一题！');
}
function prevQuestion(){ 
    currentIndex>0 && (currentIndex--, renderQuestion());
}

function updateProgress(){
    const t = currentList.length, c=currentIndex+1;
    document.getElementById('progress-text').innerText = `${c}/${t}`;
    document.getElementById('progress-bar').style.width = (c/t*100)+'%';
}

function shuffleArray(a){ 
    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a; 
}
</script>
